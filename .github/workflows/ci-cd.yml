name: Golden Owl CI/CD

on:
  push:
    branches:
      - "master"

jobs:
  # Job 1: Build và Test ứng dụng Node.js
  build-and-test:
    runs-on: ubuntu-latest # Chạy trên máy ảo Ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Sử dụng Node.js 18

      - name: Install dependencies
        run: cd src && npm i

      - name: Run tests
        run: cd src && npm test # Chạy test như trong README

  # Job 2: Build và Push Docker image lên Docker Hub
  build-and-push-docker:
    # Job này chỉ chạy sau khi 'build-and-test' thành công
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: . # Build từ thư mục gốc
          file: ./Dockerfile # Sử dụng Dockerfile
          push: true # Đẩy image đi
          # Gắn thẻ (tag) cho image, ví dụ: ten-dockerhub/golden-owl-app:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/golden-owl-app:latest