name: CD - Deploy to AWS

on:
  push:
    branches: [ master, main ]

jobs:
  cd-pipeline:
    name: "CD: Build, Push, and Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 3. Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: "golden-owl-app"
          IMAGE_TAG: "latest"
        run: |
          docker buildx build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG --push .
          
      - name: 6. Deploy to EC2 ASG (Trigger Instance Refresh)
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Starting instance refresh for ASG: $ASG_NAME"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --region $AWS_REGION \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}'
          echo "Instance refresh started!"
