name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - master

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Cai thu vien
        working-directory: src
        run: npm ci

      - name: Chay kiem thu
        working-directory: src
        run: npm test

      - name: Dang nhap DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: src
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-devops-internship-challenge:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/goldenowl-devops-internship-challenge:latest